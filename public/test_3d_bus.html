
<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #060606; overflow: hidden; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060606);
    scene.fog = new THREE.FogExp2(0x060606, 0.03);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1.5);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // Studio lighting
    const ambient = new THREE.AmbientLight(0x223344, 1.2);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const dirLight2 = new THREE.DirectionalLight(0x2E6DA4, 3.0);
    dirLight2.position.set(-8, 6, -2);
    scene.add(dirLight2);

    // Reflective floor
    const floorGeo = new THREE.PlaneGeometry(100, 100);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x080c10,
      roughness: 0.15,
      metalness: 0.8
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const loader = new GLTFLoader();
    loader.load('/models/bus_coach_heavy_duty.glb', (gltf) => {
      const model = gltf.scene;
      
      // Auto-center and fit
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      console.log('Model size:', size);
      
      model.position.x = -center.x;
      model.position.y = -box.min.y;
      model.position.z = -center.z;
      
      scene.add(model);
      camera.lookAt(0, size.y * 0.45, 0);

      window._modelReady = true;
      renderer.render(scene, camera);
    });

    window._render = () => renderer.render(scene, camera);
  </script>
</body>
</html>
